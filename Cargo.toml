[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0-alpha.2"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
authors = ["Phillip Austin Green"]
repository = "https://github.com/botzrDev/lcl"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
lcl-core = { path = "crates/lcl-core", version = "0.3.0-alpha.2" }
lcl-tui = { path = "crates/lcl-tui", version = "0.3.0-alpha.2" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rusqlite = { version = "0.42.0", features = ["backup", "bundled", "functions", "trace"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
anyhow = "1.0.104"
thiserror = "2.0.21"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
tempfile = "3.27.0"
